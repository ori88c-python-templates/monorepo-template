[project]
name = "shared-postgres"
version = "1.0.0"
description = "PostgreSQL connection wrapper. Schema lives in a database package."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "psycopg[binary]~=3.3.8",
    "shared-config",
    "sqlalchemy[asyncio]~=2.1.8",
    "structlog~=26.1.0",
]

[tool.uv.sources]
shared-config = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shared_postgres"
