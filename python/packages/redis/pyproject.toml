[project]
name = "shared-redis"
version = "1.0.0"
description = "Redis connection wrapper. Key helpers prefix the app name."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "redis~=8.1.0",
    "shared-config",
    "structlog~=26.1.0",
]

[tool.uv.sources]
shared-config = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shared_redis"
