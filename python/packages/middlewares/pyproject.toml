[project]
name = "shared-middlewares"
version = "1.0.0"
description = "HTTP middleware shared by FastAPI and FastMCP apps."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "starlette~=1.10.0",
    "structlog~=26.1.0",
]

[dependency-groups]
dev = [
    "httpx~=0.28.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shared_middlewares"
