[project]
name = "fastapi-middlewares"
version = "1.0.0"
description = "FastAPI-only HTTP middleware. FastMCP apps do not depend on this package."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "secure~=2.0.1",
    "starlette~=1.10.0",
]

[dependency-groups]
dev = [
    "fastapi>=0.162.7,<0.164.0",
    "httpx~=0.28.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fastapi_middlewares"
