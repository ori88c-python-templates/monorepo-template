[project]
name = "shared-prometheus"
version = "1.0.0"
description = "Prometheus scrape setup for Starlette apps, including FastAPI and FastMCP."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "prometheus-client~=0.26.0",
    "prometheus-fastapi-instrumentator~=8.1.0",
    "shared-config",
    "shared-middlewares",
    "starlette~=1.10.0",
]

[tool.uv.sources]
shared-config = { workspace = true }
shared-middlewares = { workspace = true }

[dependency-groups]
dev = [
    "httpx~=0.28.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shared_prometheus"
